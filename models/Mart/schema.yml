version: 2

models:
  - name: fct_orders
    description: "Fact table combining orders, customer profiles, and product details."

    columns:
      - name: order_id
        description: "Primary key of the order."

        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key referencing customers."

        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "{{ ref('customers') }}"
                field: customer_id

      - name: status
        description: "Order status."

        data_tests:
          - accepted_values:
              arguments:
                values:
                  - DELIVERED
                  - SHIPPED
                  - PENDING
                  - CANCELLED